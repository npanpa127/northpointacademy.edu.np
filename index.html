<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | North Point Academy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" type="image" href="logo.jpg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .logo-shadow {
            filter: drop-shadow(0 10px 15px rgba(79, 70, 229, 0.2));
        }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-50 via-indigo-50 to-slate-100 min-h-screen flex items-center justify-center p-6">

    <div class="max-w-lg w-full">
        <!-- Logo & School Name Section -->
        <div class="text-center mb-10">
            <!-- Big Logo Container -->
            <div class="relative inline-block mb-6 group">
                <div class="absolute -inset-1 bg-indigo-500 rounded-[2rem] blur opacity-25 group-hover:opacity-50 transition duration-1000"></div>
                <div class="relative bg-white p-2 rounded-[2rem] shadow-2xl inline-flex items-center justify-center transform hover:scale-105 transition-transform duration-500">
                    <img src="logo.jpg" 
                         class="w-32 h-32 rounded-[1.8rem] object-cover logo-shadow" alt="NPA Logo">
                </div>
            </div>
            
            <!-- Big School Name -->
            <h1 class="text-4xl md:text-5xl font-black text-slate-800 tracking-tighter mb-2">
                NORTH POINT
            </h1>
            <div class="flex items-center justify-center gap-4">
                <span class="h-[2px] w-12 bg-indigo-600 rounded-full"></span>
                <span class="text-indigo-600 text-xl font-extrabold tracking-[0.3em] uppercase">Academy</span>
                <span class="h-[2px] w-12 bg-indigo-600 rounded-full"></span>
            </div>
        </div>

        <!-- Login Card -->
        <div class="glass p-10 rounded-[3rem] shadow-[0_20px_50px_rgba(79,70,229,0.1)] border border-white">
            <div class="mb-8 text-center">
                <h2 class="text-3xl font-extrabold text-slate-800 mb-1 tracking-tight">Welcome Back!</h2>
                <p class="text-slate-500 font-medium">Log in to access your dashboard</p>
            </div>

            <form id="loginForm" class="space-y-6">
                <!-- Username -->
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-2 ml-2">Username</label>
                    <div class="relative group">
                        <span class="absolute inset-y-0 left-0 pl-5 flex items-center text-slate-400 group-focus-within:text-indigo-600 transition-colors">
                            <i class="fa-solid fa-user-tag text-lg"></i>
                        </span>
                        <input type="text" id="username" placeholder="npabuddhabatika16" required
                            class="w-full pl-14 pr-5 py-5 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-4 focus:ring-indigo-500/10 focus:border-indigo-500 focus:bg-white outline-none transition-all font-semibold text-slate-700 placeholder:text-slate-300">
                    </div>
                </div>

                <!-- Password -->
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-2 ml-2">Password</label>
                    <div class="relative group">
                        <span class="absolute inset-y-0 left-0 pl-5 flex items-center text-slate-400 group-focus-within:text-indigo-600 transition-colors">
                            <i class="fa-solid fa-shield-halved text-lg"></i>
                        </span>
                        <input type="password" id="password" placeholder="••••••••" required
                            class="w-full pl-14 pr-5 py-5 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-4 focus:ring-indigo-500/10 focus:border-indigo-500 focus:bg-white outline-none transition-all font-semibold text-slate-700 placeholder:text-slate-300">
                    </div>
                </div>

                <!-- Error Message -->
                <p id="errorMessage" class="text-rose-600 text-sm font-bold hidden bg-rose-50 p-4 rounded-2xl border border-rose-100 text-center animate-shake">
                    <i class="fa-solid fa-circle-exclamation mr-2"></i> Invalid Username or Password!
                </p>

                <!-- Login Button -->
                <button type="submit" 
                    class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-black py-5 rounded-2xl shadow-xl shadow-indigo-200 transition-all hover:-translate-y-1 active:scale-[0.98] flex items-center justify-center gap-3 text-lg">
                    <span>Sign In</span>
                    <i class="fa-solid fa-arrow-right-long"></i>
                </button>
            </form>

            <!-- Divider -->
            <div class="relative my-10">
                <div class="absolute inset-0 flex items-center"><span class="w-full border-t-2 border-slate-100"></span></div>
                <div class="relative flex justify-center text-xs uppercase"><span class="bg-white px-6 text-slate-400 font-black tracking-widest leading-none">Access Mode</span></div>
            </div>

            <!-- Guest Access Option -->
            <div class="text-center">
                <a href="view.html" 
                   class="inline-flex items-center justify-center gap-3 w-full bg-slate-50 border-2 border-slate-100 text-slate-600 hover:text-indigo-600 hover:bg-indigo-50 hover:border-indigo-100 font-bold py-5 rounded-2xl transition-all group">
                   <i class="fa-solid fa-lock-open opacity-50 group-hover:opacity-100"></i>
                   VIEW PUBLIC PAGE
                </a>
            </div>
        </div>

        <!-- Footer Info -->
        <p class="text-center mt-12 text-slate-400 text-sm font-bold uppercase tracking-widest">
            &copy; 2026 North Point Academy
        </p>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault(); 

            const correctUser = "npabuddhabatika16";
            const correctPass = "2054";

            const userInp = document.getElementById('username').value;
            const passInp = document.getElementById('password').value;
            const errMsg = document.getElementById('errorMessage');

            if (userInp === correctUser && passInp === correctPass) {
                window.location.href = "home.html"; 
            } else {
                errMsg.classList.remove('hidden');
                document.getElementById('username').classList.add('border-rose-400', 'bg-rose-50');
                document.getElementById('password').classList.add('border-rose-400', 'bg-rose-50');
                
                setTimeout(() => {
                    errMsg.classList.add('hidden');
                    document.getElementById('username').classList.remove('border-rose-400', 'bg-rose-50');
                    document.getElementById('password').classList.remove('border-rose-400', 'bg-rose-50');
                }, 3000);
            }
        });
    </script>
</body>
</html>
